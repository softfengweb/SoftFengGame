# 反向代理 + 静态资源：
#   /admin/    管理端（已构建，静态资源随镜像发布）
#   /          用户端 H5（授权方提供的产物，挂载到 /usr/share/nginx/html/h5，可缺省）
#   /api/      服务端接口（含 WebSocket 升级）
#   /uploads/  上传文件（服务端处理 ?w= 缩略图，带长缓存）
#   /health    健康检查

# WebSocket 需要把 Connection 头按 Upgrade 动态改写，map 必须定义在 http 作用域内，
# conf.d/*.conf 正好被 include 进 http 块，所以放这里合法。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 语音/视频消息可能较大，与服务端上传限制保持一致
    client_max_body_size 200m;

    # ---------- 管理端 ----------
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        expires -1;
    }

    # ---------- 用户端 H5 ----------
    location / {
        root /usr/share/nginx/html/h5;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 服务端接口（含 WebSocket） ----------
    location /api/ {
        proxy_pass http://server:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket：/api/v1/ws 与普通接口同前缀，靠 Upgrade 头切换
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 长连接不能被 60s 默认超时掐断；普通请求也不受影响
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }

    # ---------- 上传文件 ----------
    location /uploads/ {
        proxy_pass http://server:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 文件名是内容 hash，同内容不会覆盖成不同内容，可以放心长缓存
        expires 7d;
    }

    # ---------- 健康检查 ----------
    location = /health {
        proxy_pass http://server:8088/health;
        access_log off;
    }

    # 小程序支付回跳落地页（服务端自带）
    location /payment/ {
        proxy_pass http://server:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
